name: Lock closed issues and pull requests

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Lock closed threads with no activity for more than this many days."
        type: number
        required: false
        default: 7

permissions:
  contents: read

concurrency:
  group: lock-closed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lock:
    name: Lock stale closed threads
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Lock stale threads
        uses: dessant/lock-threads@v6
        with:
          issue-inactive-days: ${{ inputs.days || 7 }}
          pr-inactive-days: ${{ inputs.days || 7 }}
          process-only: issues, prs
