name: Update Typst dependencies

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bump:
    uses: mcanouil/typst-workflows/.github/workflows/dependency-update.yml@v2
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
    with:
      packages: |
        - name: cetz
          repository: cetz-package/cetz
          file: src/deps.typ
