name: Refresh visual snapshots

on:
  workflow_dispatch:
    inputs:
      direct:
        description: "Commit goldens straight to the dispatched branch (bypasses PR + auto-merge). Requires the App to bypass branch protection."
        required: false
        type: boolean
        default: false
      force:
        description: "Delete every golden before re-minting so all snapshots update and orphaned files are dropped."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  refresh:
    uses: mcanouil/typst-workflows/.github/workflows/snapshot-refresh.yml@feat/snapshot-and-dependency-workflows
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
    with:
      direct: ${{ inputs.direct }}
      force: ${{ inputs.force }}
      merge-method: merge
