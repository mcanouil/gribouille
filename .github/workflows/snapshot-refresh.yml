name: Refresh visual snapshots

on:
  workflow_dispatch:
    inputs:
      direct:
        description: "Commit goldens straight to the dispatched branch (bypasses PR + auto-merge). Requires the App to bypass branch protection."
        required: false
        type: boolean
        default: false
      force:
        description: "Delete every golden before re-minting so all snapshots update and orphaned files are dropped."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: snapshot-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Recompile and open PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      # Checkout uses the App token, so every push acts as the App and the
      # mcanouil-dev bypass on branch protection applies.
      - name: Get the App token
        id: token
        uses: mcanouil/release-actions/token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          app-key: ${{ secrets.APP_KEY }}
          require-app: true

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.token.outputs.token }}

      - name: Set up Typst
        uses: mcanouil/typst-workflows/actions/setup-typst@v2

      - name: Set up Lua
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.4"

      - name: Install ImageMagick
        shell: bash
        run: |
          set -euo pipefail
          command -v compare >/dev/null || {
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends imagemagick
          }

      - name: Regenerate goldens
        shell: bash
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [[ "${FORCE}" == "true" ]]; then
            rm -rf tests/visual/golden
          fi
          lua tools/snapshot/run.lua --update

      - name: Land the goldens
        uses: mcanouil/release-actions/land@v1
        with:
          mode: ${{ inputs.direct && 'push' || 'pull-request' }}
          files: tests/visual/golden
          message: "chore(tests): refresh visual snapshots"
          branch: ci/snapshot-refresh
          merge-method: merge
          wait: false
          allow-unchanged: true
          token: ${{ steps.token.outputs.token }}
