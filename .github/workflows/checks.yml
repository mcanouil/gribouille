name: Checks

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "lib.typ"
      - "examples/**"
      - ".github/star-history/star-history.typ"
      - ".github/star-history/*.csv"
      - "tests/**"
      - "typst.toml"
      - "tools/**"
      - "README.md"
      - "CITATION.cff"
      - ".claude-plugin/plugin.json"
      - "skills/gribouille/SKILL.md"
      - "LICENSE"
      - ".editorconfig"
      - "docs/_scripts/**.sh"
      - ".github/actions/**"
      - ".github/workflows/checks.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/**"
      - "lib.typ"
      - "examples/**"
      - ".github/star-history/star-history.typ"
      - ".github/star-history/*.csv"
      - "tests/**"
      - "typst.toml"
      - "tools/**"
      - "README.md"
      - "CITATION.cff"
      - ".claude-plugin/plugin.json"
      - "skills/gribouille/SKILL.md"
      - "LICENSE"
      - ".editorconfig"
      - "docs/_scripts/**.sh"
      - ".github/actions/**"
      - ".github/workflows/checks.yml"
  workflow_dispatch:

permissions:
  contents: read

# A pull request cancels its superseded runs. On main, every commit gets a group
# of its own, so each one keeps its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    uses: mcanouil/typst-workflows/.github/workflows/checks.yml@v2
    with:
      needs-lua: true
      needs-imagemagick: true
      check-args: --snapshot
      failure-artifacts: |
        build/snapshot/diff/
        build/snapshot/png/
      shellcheck-paths: "tools/*.sh docs/_scripts/*.sh"
      shfmt-paths: "tools/*.sh"
