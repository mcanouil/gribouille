name: Deploy Documentation

on:
  push:
    branches: [ main ]
    paths:
      - "docs/**"
      - "lib.typ"
      - "src/**"
      - "examples/**"
      - "tools/typstdoc/**"
      - "tools/package.sh"
      - "typst.toml"
      - "CHANGELOG.md"
      - ".github/workflows/deploy.yml"
  # Build (but never deploy) on pull requests: rendering the site is the only thing
  # that compiles the Typst blocks in the docs, so without this a broken block is
  # only caught once it has already landed on main.
  pull_request:
    paths:
      - "docs/**"
      - "lib.typ"
      - "src/**"
      - "examples/**"
      - "tools/typstdoc/**"
      - "tools/package.sh"
      - "typst.toml"
      - "CHANGELOG.md"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Commit or ref to build (defaults to the triggering ref)."
        type: string
        required: false
        default: ""

# Only the deploy job touches Pages; it raises its own permissions. Everything else,
# including the pull-request build of unreviewed content, stays read-only.
permissions:
  contents: read

# GitHub Pages only accepts one deployment at a time; queue instead of cancel.
# Pull requests never deploy, so give them a per-ref group: they can run in parallel
# with each other and with a deploy, and a new push supersedes the previous build.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  resolve:
    name: Resolve build matrix
    runs-on: ubuntu-latest
    # Skip the bump-version commit on main; the Release workflow deploys docs
    # itself via its `pages` job (workflow_call), so this push would double-deploy.
    if: >-
      ${{ github.event_name != 'push'
        || !startsWith(github.event.head_commit.message, 'ci: bump version to') }}

    outputs:
      tag: ${{ steps.latest-tag.outputs.tag }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      versions: ${{ steps.matrix.outputs.versions }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Resolve latest release tag
        id: latest-tag
        shell: bash
        run: |
          LATEST_TAG=$(git tag -l --sort=-v:refname '[0-9]*' | head -n 1)
          echo "tag=${LATEST_TAG}" >> "${GITHUB_OUTPUT}"
          if [ -z "${LATEST_TAG}" ]; then
            echo "No release tag found; release site will be skipped."
          else
            echo "Latest release tag: ${LATEST_TAG}"
          fi

      # Every version is built on pull requests too, not just dev: rendering is the
      # only thing that compiles the Typst blocks, and a change to this workflow or
      # to the site framework can break the release render without touching `main`'s
      # own pages. `SITE_URL` and the `versions` payload below are read from the
      # triggering ref on purpose: they describe the deployment (where the sites live,
      # which versions exist), not the API any one site documents, and `versions.json`
      # is written once at the site root after every profile has rendered.
      - name: Build render matrix
        id: matrix
        shell: bash
        env:
          LATEST_TAG: ${{ steps.latest-tag.outputs.tag }}
        run: |
          set -euo pipefail
          # versions.json entries need absolute URLs: the switcher is reachable from
          # any depth on any site, so relative paths cannot address the other sites.
          SITE_URL=$(awk '/^[[:space:]]*site-url:/ { sub(/^[[:space:]]*site-url:[[:space:]]*/, ""); gsub(/["'\'']/, ""); print; exit }' docs/_quarto.yml)
          [[ -n "${SITE_URL}" ]] || { echo "::error::site-url not found in docs/_quarto.yml"; exit 1; }
          if [ -n "${LATEST_TAG}" ]; then
            # Release at root (tagged ref), dev at /dev/ (triggering ref, i.e. main).
            # Only these two are published. Each site is rendered from its own ref, so
            # archiving older releases at /x.y.z/ is a matrix entry away; it waits on
            # the toolchain, not the content: an old tag must still render with the
            # Quarto and Typst versions CI installs. Start archiving from 1.0.0.
            matrix=$(jq -nc --arg tag "${LATEST_TAG}" '{include:[
              {profile:"release", ref:$tag, version:$tag, assets_dir:""},
              {profile:"dev", ref:"", version:"dev", assets_dir:"docs/_site/dev"}
            ]}')
            versions=$(jq -nc --arg tag "${LATEST_TAG}" --arg site "${SITE_URL}" '[
              {version:$tag, url:($site + "/"), latest:true},
              {version:"dev", url:($site + "/dev/")}
            ]')
          else
            # No release yet: dev content at root, single site and a single version.
            matrix=$(jq -nc '{include:[
              {profile:"no-release", ref:"", version:"dev", assets_dir:"docs/_site"}
            ]}')
            versions=$(jq -nc --arg site "${SITE_URL}" '[{version:"dev", url:($site + "/")}]')
          fi
          {
            echo "matrix=${matrix}"
            echo "versions=${versions}"
          } >> "${GITHUB_OUTPUT}"

  build:
    name: Render ${{ matrix.profile }} site
    needs: resolve
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}

    env:
      GH_TOKEN: ${{ github.token }}
      QUARTO_TYPST: typst
      # Drives the navbar label and the example `@preview` import rewrite.
      VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      # The release site is rendered wholly from the tag: docs content, website
      # framework, Typst code, and the docstring generator all move together, so a
      # page never documents API the pinned source lacks and a breaking rename needs
      # no gate. Actions already loaded this workflow from the triggering ref, so
      # switching the working tree does not change the steps that follow.
      - name: Check out the release ref
        if: ${{ matrix.ref != '' }}
        shell: bash
        run: |
          set -euo pipefail
          git checkout --force "${{ matrix.ref }}"
          head=$(git rev-parse HEAD)
          want=$(git rev-parse "${{ matrix.ref }}^{commit}")
          [[ "${head}" == "${want}" ]] \
            || { echo "::error::working tree is at ${head}, expected ${want}"; exit 1; }

      # The commit actually rendered: the tag for the release profile, the triggering
      # ref otherwise. Keys the figure cache, so the release entry is written once per
      # tag instead of once per push to main.
      - name: Resolve rendered commit
        id: rendered
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      # Read after the ref switch: each site compiles with the compiler its own
      # `typst.toml` pins. Inline rather than `./.github/actions/typst-version`,
      # since a local composite action is loaded from the workspace, which is the
      # tag's tree here and need not carry that action.
      - name: Read Typst version from typst.toml
        id: typst-version
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk -F'"' '/^compiler[[:space:]]*=/ { print $2; exit }' typst.toml)
          [[ -n "$version" ]] || { echo "::error::compiler not found in typst.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: ${{ steps.typst-version.outputs.version }}

      # typst-render caches compiled figures under `docs/.quarto` (gitignored), so
      # every run otherwise recompiles all ~4000 of them from scratch at roughly a
      # second each. Each filename embeds a hash of the block and of the Typst
      # sources it imports, so a source change cannot serve a stale figure; the
      # compiler version is not part of that hash, hence the key. Bump the `v1`
      # epoch to discard accumulated entries (nothing prunes them: cache-refresh
      # is off).
      - name: Cache compiled Typst figures
        uses: actions/cache@v6
        with:
          path: docs/.quarto/typst-render
          key: >-
            typst-render-v1-${{ matrix.version }}-${{ steps.typst-version.outputs.version }}-${{ steps.rendered.outputs.sha }}
          restore-keys: |
            typst-render-v1-${{ matrix.version }}-${{ steps.typst-version.outputs.version }}-

      # No ref records a Quarto version, so both sites render with the current
      # release; pinning it per ref would mean inventing a file to hold it.
      - name: Set up Quarto CLI
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: release

      # Computed once so the install page and the downloadable archive carry the
      # same dated version. A date is a valid Typst (3-integer) version and marks
      # the build as a development snapshot.
      - name: Resolve dev version
        shell: bash
        run: echo "DEV_VERSION=$(date -u +%Y.%-m.%-d)" >> "${GITHUB_ENV}"

      # typst-render swaps a placeholder in for a Typst block that fails to compile
      # and the render still exits 0, so a broken figure ships with every job green.
      # Match the failures in the log: they arrive as INFO records, so --log-level
      # cannot select them, and --fail-if-warnings would trip on benign warnings.
      - name: Render site
        shell: bash
        env:
          RENDER_LOG: ${{ runner.temp }}/render.log
        run: |
          set -euo pipefail
          quarto render docs --profile "${{ matrix.profile }}" \
            --log "${RENDER_LOG}" --log-format json-stream
          failures=$(jq -r '.msg' "${RENDER_LOG}" | grep '\[typst-render\] Compilation failed' || true)
          if [ -n "${failures}" ]; then
            echo "::error::Typst blocks failed to compile; see the failures below."
            echo "${failures}"
            exit 1
          fi

      - name: Set up Lua
        if: ${{ matrix.assets_dir != '' }}
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.4"

      - name: Package development version
        if: ${{ matrix.assets_dir != '' }}
        shell: bash
        run: tools/package.sh archive "${{ matrix.assets_dir }}" gribouille "${DEV_VERSION}"

      - name: Upload site artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: site-${{ matrix.profile }}
          path: docs/_site
          retention-days: 1

  deploy:
    name: Deploy docs to GitHub Pages
    needs: [ resolve, build ]
    runs-on: ubuntu-latest
    # Pull requests build to catch Typst failures; publishing stays a main-only step.
    if: ${{ github.event_name != 'pull_request' }}

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download site artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: site-*
          merge-multiple: true
          path: docs/_site

      # Written once at the site root and read by every site's version switcher, so
      # publishing a version lists it on the already-deployed sites without a rebuild.
      - name: Prepare site for deployment
        shell: bash
        env:
          VERSIONS: ${{ needs.resolve.outputs.versions }}
        run: |
          set -euo pipefail
          touch docs/_site/.nojekyll
          jq -e . <<< "${VERSIONS}" > docs/_site/versions.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./docs/_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Summary
        shell: bash
        env:
          LATEST_TAG: ${{ needs.resolve.outputs.tag }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo "## Documentation deploy"
            echo ""
            if [ -n "${LATEST_TAG}" ]; then
              echo "- Root site source: \`${LATEST_TAG}\` (release)"
              echo "- Dev site source: \`main\`"
              echo "- Root URL: ${PAGE_URL}"
              echo "- Dev URL: ${PAGE_URL}dev/"
            else
              echo "- Root site source: \`main\` (no release tag yet)"
              echo "- Root URL: ${PAGE_URL}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
