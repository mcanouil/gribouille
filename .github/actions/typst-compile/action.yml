name: Compile Typst sources
description: Compile every Typst file in a directory and report pass/fail counts.

inputs:
  label:
    description: "Human label shown in the summary (e.g., 'unit', 'example')."
    required: true
  glob:
    description: "Glob pattern for files to compile (e.g., 'tests/unit/*.typ')."
    required: true
  root:
    description: "Typst project root passed with --root."
    required: false
    default: "."

outputs:
  passed:
    description: "Number of files that compiled successfully."
    value: ${{ steps.compile.outputs.passed }}
  total:
    description: "Total number of files considered."
    value: ${{ steps.compile.outputs.total }}
  failed:
    description: "Number of files that failed to compile."
    value: ${{ steps.compile.outputs.failed }}
  failures:
    description: "Newline-joined paths of files that failed to compile."
    value: ${{ steps.compile.outputs.failures }}

runs:
  using: composite
  steps:
    - id: compile
      shell: bash
      env:
        GLOB: ${{ inputs.glob }}
        ROOT: ${{ inputs.root }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        # shellcheck disable=SC2206 # unquoted on purpose: the input is a glob to expand.
        FILES=(${GLOB})
        TOTAL=${#FILES[@]}
        RESULTS=$(mktemp -d)
        : > "${RESULTS}/status"
        mkdir "${RESULTS}/logs"
        export ROOT RESULTS
        # Compile in parallel across all cores. Workers cannot share stdout
        # (interleaved group markers), so each writes its own log block and a
        # status line (short O_APPEND writes are atomic); logs are replayed in
        # input order once all compiles finish.
        compile_one() {
          set -euo pipefail
          f="$1"
          if out=$(typst compile "${f}" --root "${ROOT}" "/tmp/$(basename "${f%.typ}").pdf" 2>&1); then
            status=pass
          else
            status=fail
          fi
          {
            echo "::group::Compile ${f}"
            [[ -n "${out}" ]] && printf '%s\n' "${out}"
            [[ "${status}" == "fail" ]] && echo "::error file=${f}::Typst compilation failed"
            echo "::endgroup::"
          } > "${RESULTS}/logs/${f//\//_}.log"
          echo "${status} ${f}" >> "${RESULTS}/status"
        }
        export -f compile_one
        if [[ ${TOTAL} -gt 0 ]]; then
          # shellcheck disable=SC2016 # single quotes on purpose: $1 expands in the sub-bash.
          printf '%s\0' "${FILES[@]}" \
            | xargs -0 -n 1 -P "$(getconf _NPROCESSORS_ONLN)" bash -c 'compile_one "$1"' _
          for f in "${FILES[@]}"; do cat "${RESULTS}/logs/${f//\//_}.log"; done
        fi
        PASSED=$(grep -c '^pass ' "${RESULTS}/status" || true)
        FAILURES=$(sed -n 's/^fail //p' "${RESULTS}/status")
        FAILED_COUNT=$((TOTAL - PASSED))
        rm -rf "${RESULTS}"
        {
          echo "passed=${PASSED}"
          echo "total=${TOTAL}"
          echo "failed=${FAILED_COUNT}"
          echo "failures<<EOF"
          [[ -n "${FAILURES}" ]] && echo "${FAILURES}"
          echo "EOF"
        } >> "${GITHUB_OUTPUT}"
        if [[ ${FAILED_COUNT} -gt 0 ]]; then exit 1; fi
