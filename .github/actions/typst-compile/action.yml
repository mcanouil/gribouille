name: Compile Typst sources
description: Compile every Typst file in a directory and report pass/fail counts.

inputs:
  label:
    description: "Human label shown in the summary (e.g., 'unit', 'example')."
    required: true
  glob:
    description: "Glob pattern for files to compile (e.g., 'tests/unit/*.typ')."
    required: true
  root:
    description: "Typst project root passed with --root."
    required: false
    default: "."

outputs:
  passed:
    description: "Number of files that compiled successfully."
    value: ${{ steps.compile.outputs.passed }}
  total:
    description: "Total number of files considered."
    value: ${{ steps.compile.outputs.total }}
  failed:
    description: "Number of files that failed to compile."
    value: ${{ steps.compile.outputs.failed }}
  failures:
    description: "Newline-joined paths of files that failed to compile."
    value: ${{ steps.compile.outputs.failures }}

runs:
  using: composite
  steps:
    - id: compile
      shell: bash
      env:
        GLOB: ${{ inputs.glob }}
        ROOT: ${{ inputs.root }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        # shellcheck disable=SC2206 # unquoted on purpose: the input is a glob to expand.
        FILES=(${GLOB})
        TOTAL=${#FILES[@]}
        RESULTS=$(mktemp -d)
        export ROOT RESULTS
        # Compile in parallel across all cores; buffer each file's log and
        # print it atomically so groups do not interleave. Status lines land
        # in one file per compile, aggregated below.
        compile_one() {
          set -euo pipefail
          f="$1"
          out=$(mktemp)
          if typst compile "${f}" --root "${ROOT}" "/tmp/$(basename "${f%.typ}").pdf" > "${out}" 2>&1; then
            status=pass
          else
            status=fail
          fi
          {
            echo "::group::Compile ${f}"
            cat "${out}"
            [[ "${status}" == "fail" ]] && echo "::error file=${f}::Typst compilation failed"
            echo "::endgroup::"
          } > "${out}.block"
          cat "${out}.block"
          rm -f "${out}" "${out}.block"
          echo "${status} ${f}" > "${RESULTS}/$(echo "${f}" | tr '/' '_').status"
        }
        export -f compile_one
        if [[ ${TOTAL} -gt 0 ]]; then
          # shellcheck disable=SC2016 # single quotes on purpose: $1 expands in the sub-bash.
          printf '%s\0' "${FILES[@]}" \
            | xargs -0 -n 1 -P "$(getconf _NPROCESSORS_ONLN)" bash -c 'compile_one "$1"' _
        fi
        # The extra /dev/null keeps cat off stdin when nullglob leaves no matches.
        PASSED=$(cat "${RESULTS}"/*.status /dev/null | grep -c '^pass ' || true)
        FAILURES=$(cat "${RESULTS}"/*.status /dev/null | awk '/^fail /{ sub(/^fail /, ""); print }')
        FAILED_COUNT=$(grep -c . <<< "${FAILURES}" || true)
        rm -rf "${RESULTS}"
        {
          echo "passed=${PASSED}"
          echo "total=${TOTAL}"
          echo "failed=${FAILED_COUNT}"
          echo "failures<<EOF"
          echo "${FAILURES}"
          echo "EOF"
        } >> "${GITHUB_OUTPUT}"
        if [[ ${FAILED_COUNT} -gt 0 ]]; then exit 1; fi
