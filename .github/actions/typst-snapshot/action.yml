name: Compile + diff visual snapshots
description: Run the snapshot harness in --check or --update mode and surface diff artefacts.

inputs:
  mode:
    description: "Either 'check' (default, gates CI) or 'update' (rewrites goldens)."
    required: false
    default: "check"
  jobs:
    description: "Parallel typst compiles passed as --jobs (default: 4 to match ubuntu-latest vCPUs)."
    required: false
    default: "4"
  fuzz:
    description: "ImageMagick -fuzz tolerance passed as --fuzz in check mode (default: 2%)."
    required: false
    default: "2%"
  force:
    description: "In update mode, delete every golden first so all snapshots re-mint and orphaned files are dropped."
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install ImageMagick
      shell: bash
      # The harness compiles with --ignore-system-fonts, so only Typst's
      # embedded fonts are used; no system font packages are needed here.
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          imagemagick

    - name: Run snapshot harness
      id: snapshot
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        JOBS: ${{ inputs.jobs }}
        FUZZ: ${{ inputs.fuzz }}
        FORCE: ${{ inputs.force }}
      run: |
        set -euo pipefail
        log="${RUNNER_TEMP}/snapshot.log"
        case "${MODE}" in
          check)
            lua tools/snapshot/run.lua --check --jobs "${JOBS}" --fuzz "${FUZZ}" 2>&1 | tee "${log}"
            ;;
          update)
            if [[ "${FORCE}" == "true" ]]; then
              rm -rf tests/visual/golden
            fi
            lua tools/snapshot/run.lua --update --jobs "${JOBS}" 2>&1 | tee "${log}"
            ;;
          *) echo "::error::unknown snapshot mode: ${MODE}"; exit 2 ;;
        esac

    - name: Upload diffs on failure
      if: failure() && inputs.mode == 'check'
      uses: actions/upload-artifact@v4
      with:
        name: visual-snapshot-diffs
        path: |
          build/snapshot/diff/
          build/snapshot/png/
        if-no-files-found: ignore
        retention-days: 14
