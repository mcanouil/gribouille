# Project-wide filter chain. Order matters: version-gate must run first so a page
# too new for the version being built never reaches `typst-render`; examples-data
# must run before `typst-render` and `modal` so they see the blocks it injects on
# the examples page.
filters:
  - assets/lua/version-gate.lua
  - assets/lua/examples-data.lua
  - typst-render
  - modal
  - gitlink
  - code-window

extensions:
  typst-render:
    root: "../"
    preamble: "_typst-preamble.typ"
    style: "display: block; margin-inline: auto;"
    align: center
    background: auto
    foreground: auto
    width: auto
    height: auto
    margin: 2pt
  modal:
    size: lg
    scrollable: true
