# Project-wide filter chain. Order matters: examples-data must run before
# `typst-render` and `modal` so they see the blocks it injects on the examples
# page.
filters:
  - assets/lua/examples-data.lua
  - typst-render
  - modal
  - at: post-quarto
    path: gitlink
  - code-window

extensions:
  typst-render:
    root: "../"
    preamble: "_typst-preamble.typ"
    style: "display: block; margin-inline: auto;"
    align: center
    background: auto
    foreground: auto
    width: auto
    height: auto
    margin: 2pt
  modal:
    size: lg
    scrollable: true
  gitlink:
    # The platform and repository come from `website.repo-url`. The widget
    # replaces the `#gitlink-widget` navbar placeholder with the star/fork
    # button and project menu.
    widget:
      enabled: true
      extra-links:
        - text: "Ideas"
          href: "/discussions/categories/ideas"
          icon: discussion
        - text: "Q&A"
          href: "/discussions/categories/q-a"
          icon: question
        - text: "{{< iconify simple-icons:typst aria-hidden='true' >}} Typst Universe"
          href: "https://typst.app/universe/package/gribouille"
      sponsor: mcanouil
      style-navbar-tools: true
