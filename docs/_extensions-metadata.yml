# Project-wide filter chain. Order matters: gallery-data must run before
# `typst-render` and `modal` so they see the blocks it injects on the gallery
# pages. Atelier runs its bundled gitlink, code-window, and iconify itself, so
# none of them is listed here.
filters:
  - assets/lua/gallery-data.lua
  - typst-render
  - modal

extensions:
  typst-render:
    root: "../"
    preamble: "_typst-preamble.typ"
    style: "display: block; margin-inline: auto;"
    align: center
    background: auto
    foreground: auto
    width: auto
    height: auto
    margin: 2pt
  modal:
    size: lg
    scrollable: true
  gitlink:
    # The platform and repository come from `website.repo-url`. Atelier turns
    # the widget on and link rewriting off; the generated changelog page turns
    # rewriting back on in its own front matter.
    widget:
      extra-links:
        - text: "Ideas"
          href: "/discussions/categories/ideas"
          icon: discussion
        - text: "Q&A"
          href: "/discussions/categories/q-a"
          icon: question
        - text: "{{< iconify simple-icons:typst aria-hidden='true' >}} Typst Universe"
          href: "https://typst.app/universe/package/gribouille"
      sponsor: mcanouil
      style-navbar-tools: true
