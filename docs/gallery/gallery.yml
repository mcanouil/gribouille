# --- Advanced techniques ------------------------------------------------------

- slug: factor-inline
  intent: techniques
  data: "three or more variables"
  title: "Inline factor coercion"
  description: '[`as-factor`](../reference/core/as-factor.qmd) forces a numeric column to be treated as discrete for the colour aesthetic.'
  alt: "Scatter plot of a noisy sinusoidal pattern with points coloured by a three-level cluster factor coerced from a numeric column."

- slug: late-binding-after-stat
  intent: techniques
  data: "any"
  title: "after-stat: bind to a stat output"
  description: '[`after-stat`](../reference/core/after-stat.qmd) binds an aesthetic to a column produced by the layer''s stat; here y is mapped to the `_count` column emitted by `stat-count`.'
  alt: "Bar chart of category counts with the y aesthetic bound explicitly via after-stat, matching the implicit y default."

- slug: late-binding-after-scale
  intent: techniques
  data: "any"
  title: "after-scale: transform resolved values"
  description: '[`after-scale`](../reference/core/after-scale.qmd) mirrors the trained fill palette into the colour channel and darkens it, so each marker outline tracks its own fill.'
  alt: "Coloured scatter where each marker outline is a darker variant of the same fill palette swatch, computed via after-scale."

- slug: late-binding-after-scale-shape
  intent: techniques
  data: "any"
  title: "after-scale on shape"
  description: '[`after-scale`](../reference/core/after-scale.qmd) on the shape channel transforms the resolved shape kind per row, flipping between two glyphs based on a per-row predicate.'
  alt: "Scatter where each row picks one of two marker shapes via a per-row predicate driving the shape channel through after-scale."

- slug: late-binding-from-theme
  intent: techniques
  data: "any"
  title: "from-theme: pull theme colours"
  description: '[`from-theme`](../reference/core/from-theme.qmd) pins a layer''s stroke to the active theme''s ink and the marker fill to the accent colour, resolved once at layer prepare time.'
  alt: "Scatter where the marker fill follows the theme accent and the stroke follows the theme ink, both resolved via from-theme."

- slug: late-binding-stage
  intent: techniques
  data: "any"
  title: "stage: combine start, after-stat, after-scale"
  description: '[`stage`](../reference/core/stage.qmd) trains the colour aesthetic on the same column the fill scale uses, then transparentises the resolved palette swatch as the marker outline.'
  alt: "Scatter where each marker outline is a translucent variant of the matching fill palette swatch, composed via stage(start, after-scale)."

- slug: identity-scales
  intent: techniques
  data: "any"
  title: "Identity scales"
  description: '[`scale-identity`](../reference/scales/scale-identity.qmd) and [`scale-identity`](../reference/scales/scale-identity.qmd) pass column values directly to the visual property.'
  alt: "Scatter of five points where hex colour strings drive marker fill and shape names drive marker glyph directly via identity scales."

- slug: refs-trans
  intent: techniques
  data: "two numerics"
  title: "Reference lines through axis transforms"
  description: '[`geom-hline`](../reference/geoms/geom-hline.qmd) intercepts route through the active y-axis transform so they land at the correct log positions.'
  alt: "Line and point chart of an exponential curve on a log10 y axis with three dashed red horizontal reference lines at y equals 10, 100, and 1000."

- slug: scale-log-pre-stat
  intent: techniques
  data: "two numerics"
  title: "Log scale pre-transforms data"
  description: '[`scale-log10`](../reference/scales/scale-log10.qmd) transforms data before stats run; [`geom-smooth`](../reference/geoms/geom-smooth.qmd) fits the line in log space.'
  alt: "Two stacked panels of the same power-law dataset with a linear smoother: the linear x panel curves while the log10 x panel produces a straight line."

- slug: weight
