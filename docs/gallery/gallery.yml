# Gallery data, consumed by the per-intent listings under `docs/gallery/*.qmd`
# and by `assets/lua/gallery-data.lua` (which injects the typst render blocks
# and modal source blocks for the matching page).
# One entry per `.typ` file in `examples/` (project root), except the hero/landing
# assets `gribouille` and `showcase`, which are embedded directly in the site.
# This invariant is enforced by `tools/typstdoc/main.lua` (see EXAMPLE_GALLERY_EXCLUDE);
# a slug present in either this file or `docs/examples/gallery.yml` satisfies it.
# All values MUST be single-line scalars (the Lua filter uses a flat parser).
#
# Fields:
#   slug:        matches the `.typ` basename, the rendered SVG name, and the modal id.
#   intent:      page key, one of: comparison | distribution | evolution | correlation |
#                part-to-whole | uncertainty | annotation | colour-scales |
#                axes-legends | layout | themes | techniques.
#   data:        data-shape badge, one of: "one numeric" | "one categorical" |
#                "two numerics" | "two categoricals" | "numeric vs categorical" |
#                "three or more variables" | "time series" | "coordinates" | "any".
#   chart:       optional chart-type badge, e.g. "grouped bar chart".
#   showcase:    optional `true`; showcase entries render first and larger.
#   title:       card heading.
#   description: Pandoc markdown.
#   alt:         image alt text.

