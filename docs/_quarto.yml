project:
  # Atelier gives the project type, the layout, the chrome, and the bundled
  # extensions. The format below is `atelier-html`, configured by name: naming
  # `html` would replace it and drop atelier's theme, scripts, and filters.
  type: atelier
  output-dir: _site
  # pre-render.sh is shared with keisen and writes a changelog.qmd. typstdoc
  # runs after it, writes the reference pages and _variables.yml, and replaces
  # changelog.qmd with its own page (news links, footer, dev-only Unreleased
  # block). post-render.sh removes both generated files.
  pre-render:
    - ./_scripts/pre-render.sh
    - ../tools/typstdoc/main.lua
  post-render:
    - ./_scripts/post-render.sh
    - ./_scripts/typst-render-check.sh
  resources:
    - assets/fonts/
    - assets/images/logo.svg
    - assets/images/logo-dark.svg
    - assets/images/logo-stacked.svg
    - assets/images/logo-stacked-dark.svg
    - assets/images/favicon.svg
    - assets/images/favicon-dark.svg
    - assets/images/social-card.png

image: /assets/images/social-card.png

website:
  title: "Gribouille"
  description: "Create elegant graphics with the Grammar of Graphics for Typst."
  favicon: assets/images/favicon.svg
  site-url: &site-url https://m.canouil.dev/gribouille
  repo-url: https://github.com/mcanouil/gribouille
  repo-subdir: docs

  page-footer:
    left: |
      Powered by [{{< iconify simple-icons:quarto aria-hidden='true' >}} Quarto](https://quarto.org).
    center: |
      &copy; []{#current-year} [Mickaël CANOUIL](https://mickael.canouil.fr). [{{< iconify octicon:heart-fill-16 aria-hidden='true' >}} Sponsor](https://github.com/sponsors/mcanouil?o=esb).
    right: |
      Licence: [MIT](https://github.com/mcanouil/gribouille?tab=MIT-1-ov-file#readme).

  navbar:
    title: "Gribouille"
    logo: assets/images/logo-dark.svg
    logo-alt: "Gribouille"
    left:
      # - text: "{{< iconify octicon:home-16 aria-hidden='true' >}} Home"
      #   href: index.qmd
      #   aria-label: "Home"
      - text: "{{< iconify octicon:rocket-16 aria-hidden='true' >}} Get Started"
        href: get-started/index.qmd
        aria-label: "Get Started"
      - text: "{{< iconify octicon:book-16 aria-hidden='true' >}} Guides"
        aria-label: "Guides"
        menu:
          - text: "{{< iconify octicon:paintbrush-16 aria-hidden='true' >}} Theming"
            href: guides/theming.qmd
          - text: "{{< iconify octicon:list-unordered-16 aria-hidden='true' >}} Recipes"
            href: guides/recipes.qmd
          - text: "{{< iconify octicon:database-16 aria-hidden='true' >}} Wrangling data"
            href: guides/wrangle.qmd
          - text: "{{< iconify octicon:accessibility-16 aria-hidden='true' >}} Accessibility"
            href: guides/accessibility.qmd
          - text: "{{< iconify octicon:graph-16 aria-hidden='true' >}} Benchmarks"
            href: guides/benchmarks.qmd
          - text: "{{< iconify octicon:copilot-16 aria-hidden='true' >}} AI Assistants"
            href: guides/ai-assistants.qmd
      - text: "{{< iconify octicon:code-16 aria-hidden='true' >}} Reference"
        href: reference/index.qmd
        aria-label: "Reference"
      - text: "{{< iconify octicon:image-16 aria-hidden='true' >}} Gallery"
        href: gallery/index.qmd
        aria-label: "Gallery"
      - text: "{{< iconify octicon:megaphone-16 aria-hidden='true' >}} News"
        href: news/index.qmd
        aria-label: "News"
      - text: "{{< iconify octicon:history-16 aria-hidden='true' >}} Changelog"
        href: changelog.qmd
        aria-label: "Changelog"
    right:
      # Versions only: assets/scripts/version-switcher.html replaces the placeholder
      # below at load with one entry per version read from the site-root
      # versions.json. Kept apart from the resource links so the list, which grows
      # with each release, never bloats a mixed menu.
      - text: "{{< iconify octicon:tag-16 aria-hidden='true' >}} {{< env VERSION >}}"
        menu:
          - text: "{{< iconify octicon:versions-16 aria-hidden='true' >}} Versions"
            href: "#version-switcher"
      # Gitlink widget: the gitlink extension replaces this placeholder at load
      # with a button showing live star/fork counts and a project menu
      # (repository, issues, pull requests, releases, star, fork, Typst Universe,
      # sponsor), superseding the former standalone "Typst Universe", "Source
      # code", "All releases", and "Sponsor" links. See _extensions-metadata.yml.
      - text: "{{< iconify octicon:mark-github-16 title=\"GitHub\" label=\"GitHub\" >}}"
        href: "#gitlink-widget"
        aria-label: "GitHub"

# Quarto keeps the `website` block out of the metadata it hands to Lua filters,
# so atelier's social-metadata filter reads the site URL here to build `og:url`
# and the canonical link. The anchor republishes `website.site-url`.
extensions:
  atelier:
    site-url: *site-url

brand: _brand.yml

format:
  # Configure the extension format by name. Declaring `html` would replace
  # `atelier-html` rather than configure it. Atelier sets the TOC, code, link,
  # language, date, and colour-scheme options; only gribouille's own differ.
  atelier-html:
    fig-align: center
    grid:
      sidebar-width: 300px
      body-width: 1100px
      margin-width: 300px
    # theme.scss stays last, so it wins the cascade over the brand.
    theme:
      light: &theme
        - brand
        - assets/stylesheets/theme.scss
      dark: *theme
    include-after-body:
      - file: assets/scripts/gallery-toc.html
      - file: assets/scripts/version-switcher.html

execute:
  freeze: false

lightbox: auto

metadata-files:
  - _extensions-metadata.yml
  - _sidebar-reference.yml
  - _sidebar-get-started.yml
  - _sidebar-gallery.yml
