project:
  type: website
  # lib-dir: lib
  output-dir: _site
  pre-render:
    - ../tools/typstdoc/main.lua
  resources:
    - assets/fonts/
    - assets/images/logo.svg
    - assets/images/logo-dark.svg
    - assets/images/logo-stacked.svg
    - assets/images/logo-stacked-dark.svg
    - assets/images/favicon.svg
    - assets/images/favicon-dark.svg
    - assets/images/social-card.png

lang: en-GB
date-format: "dddd[, the] Do [of] MMMM, YYYY"
image: /assets/images/social-card.png

website:
  title: "Gribouille"
  description: "Create elegant graphics with the Grammar of Graphics for Typst."
  favicon: assets/images/favicon.svg
  site-url: https://m.canouil.dev/gribouille
  repo-url: https://github.com/mcanouil/gribouille
  repo-actions: [ edit, issue ]
  repo-link-target: _blank
  repo-link-rel: noopener noreferrer
  open-graph: true
  twitter-card: true
  page-navigation: true
  back-to-top-navigation: true
  llms-txt: true

  page-footer:
    border: true
    background: dark
    foreground: light
    left: |
      Powered by [{{< iconify simple-icons:quarto title="Quarto Logo" label="Quarto Logo" >}} Quarto](https://quarto.org).
    center: |
      &copy; []{#current-year} [Mickaël CANOUIL](https://mickael.canouil.fr). [{{< iconify octicon:heart-fill-16 title="Heart" label="Heart" >}} Sponsor](https://github.com/sponsors/mcanouil?o=esb).
    right: |
      Licence: [MIT](https://github.com/mcanouil/gribouille?tab=MIT-1-ov-file#readme).

  navbar:
    title: "Gribouille"
    logo: assets/images/logo-dark.svg
    logo-alt: "Gribouille"
    background: dark
    foreground: light
    search: true
    left:
      # - text: "{{< iconify octicon:home-16 title=\"Home\" label=\"Home\" >}} Home"
      #   href: index.qmd
      #   aria-label: "Home"
      - text: "{{< iconify octicon:rocket-16 title=\"Get Started\" label=\"Get Started\" >}} Get Started"
        href: get-started/index.qmd
        aria-label: "Get Started"
      - text: "{{< iconify octicon:book-16 title=\"Guides\" label=\"Guides\" >}} Guides"
        aria-label: "Guides"
        menu:
          - text: "{{< iconify octicon:paintbrush-16 title=\"Theming\" label=\"Theming\" >}} Theming"
            href: guides/theming.qmd
          - text: "{{< iconify octicon:list-unordered-16 title=\"Recipes\" label=\"Recipes\" >}} Recipes"
            href: guides/recipes.qmd
          - text: "{{< iconify octicon:database-16 title=\"Wrangling data\" label=\"Wrangling data\" >}} Wrangling data"
            href: guides/wrangle.qmd
          - text: "{{< iconify octicon:accessibility-16 title=\"Accessibility\" label=\"Accessibility\" >}} Accessibility"
            href: guides/accessibility.qmd
          - text: "{{< iconify octicon:graph-16 title=\"Benchmarks\" label=\"Benchmarks\" >}} Benchmarks"
            href: guides/benchmarks.qmd
          - text: "{{< iconify octicon:copilot-16 title=\"AI Assistants\" label=\"AI Assistants\" >}} AI Assistants"
            href: guides/ai-assistants.qmd
      - text: "{{< iconify octicon:code-16 title=\"Reference\" label=\"Reference\" >}} Reference"
        href: reference/index.qmd
        aria-label: "Reference"
      - text: "{{< iconify octicon:image-16 title=\"Examples\" label=\"Examples\" >}} Examples"
        href: examples/index.qmd
        aria-label: "Examples"
      - text: "{{< iconify octicon:megaphone-16 title=\"News\" label=\"News\" >}} News"
        href: news/index.qmd
        aria-label: "News"
      - text: "{{< iconify octicon:history-16 title=\"Changelog\" label=\"Changelog\" >}} Changelog"
        href: changelog.qmd
        aria-label: "Changelog"
    right:
      # Versions only: assets/scripts/version-switcher.html replaces the placeholder
      # below at load with one entry per version read from the site-root
      # versions.json. Kept apart from the resource links so the list, which grows
      # with each release, never bloats a mixed menu.
      - text: "{{< iconify octicon:tag-16 title=\"Current version\" label=\"Current version\" >}} {{< env VERSION >}}"
        menu:
          - text: "{{< iconify octicon:versions-16 title=\"Switch version\" label=\"Switch version\" >}} Versions"
            href: "#version-switcher"
      # Gitlink widget: the gitlink extension replaces this placeholder at load
      # with a button showing live star/fork counts and a project menu
      # (repository, issues, pull requests, releases, star, fork, Typst Universe,
      # sponsor), superseding the former standalone "Typst Universe", "Source
      # code", "All releases", and "Sponsor" links. See _extensions-metadata.yml.
      - text: "{{< iconify octicon:mark-github-16 title=\"GitHub\" label=\"GitHub\" >}}"
        href: "#gitlink-widget"
        aria-label: "GitHub"

brand: _brand.yml

format:
  html:
    toc: true
    toc-depth: 3
    code-copy: true
    code-link: false
    code-overflow: wrap
    anchor-sections: true
    link-external-newwindow: true
    fig-align: center
    grid:
      sidebar-width: 300px
      body-width: 1100px
      margin-width: 300px
    theme:
      light: &theme
        - cosmo
        - brand
        - assets/stylesheets/theme.scss
      dark: *theme
    respect-user-color-scheme: true
    syntax-highlighting:
      light: github-light
      dark: github-dark
    include-before-body:
      - file: assets/scripts/skip-link.html
    include-after-body:
      - file: assets/scripts/current-year.html
      - file: assets/scripts/external-links.html
      - file: assets/scripts/gallery-toc.html
      - file: assets/scripts/ordinal-dates.html
      - file: assets/scripts/a11y-fixes.html
      - file: assets/scripts/navbar-tooltips.html
      - file: assets/scripts/version-switcher.html

execute:
  freeze: false

lightbox: auto

metadata-files:
  - _extensions-metadata.yml
  - _sidebar-reference.yml
  - _sidebar-get-started.yml
  - _sidebar-examples.yml
